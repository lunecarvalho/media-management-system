# Preparação somente: não aplicar até aprovação da Fase 2. Não cria banco.
services:
  - type: web
    name: mediatrack
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    # Free não possui preDeployCommand. Instância única, migrações antes do servidor.
    dockerCommand: /bin/sh /app/scripts/start-render.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.render
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
