{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - MediaTrack</title>

    <link rel="stylesheet" href="{% static 'css/design-system.css' %}">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="card login-card">
        <div class="login-marca">
            <div class="login-logo">MT</div>
            <div>
                <h1>MediaTrack</h1>
                <small>Acervo físico</small>
            </div>
        </div>

        {% if form.errors %}
        <div class="alerta alerta-erro">Usuário ou senha inválidos.</div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <label for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username" autofocus required>

            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" required>

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primaria">Entrar</button>
        </form>
    </div>
</body>
</html>
