{% if page_obj.paginator.num_pages > 1 %}
<nav class="linha-formulario" aria-label="Paginação">
    {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">Anterior</a>{% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">Próxima</a>{% endif %}
</nav>
{% endif %}
