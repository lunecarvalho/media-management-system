name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediatrack_ci
          POSTGRES_USER: mediatrack
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://mediatrack:ci-only-password@localhost:5432/mediatrack_ci' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput --settings=config.static_settings
      - run: python scripts/build_bundle.py
      # Construir o pacote exato destinado ao EB, não o diretório de desenvolvimento.
      - run: |
          mkdir bundle-check
          python -m zipfile -e dist/mediatrack.zip bundle-check
          docker build -t mediatrack-ci bundle-check
          docker run --rm mediatrack-ci python -c "import gunicorn; import psycopg; import django"
      - uses: actions/upload-artifact@v4
        with:
          name: mediatrack-source
          path: dist/mediatrack.zip
          retention-days: 7
