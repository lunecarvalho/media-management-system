name: AWS deployment (manual, disabled by default)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Autorizar deploy no ambiente AWS previamente configurado'
        type: boolean
        default: false
      database_ready:
        description: 'Backup verificado e migrações aplicadas em janela controlada'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: aws-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    if: github.repository == 'lunecarvalho/media-management-system' && inputs.confirm && inputs.database_ready && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EB_APPLICATION: ${{ vars.EB_APPLICATION }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
      EB_ARTIFACT_BUCKET: ${{ vars.EB_ARTIFACT_BUCKET }}
      RDS_CA_BUNDLE_URL: ${{ vars.RDS_CA_BUNDLE_URL }}
      VERSION: mediatrack-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validar habilitação do deploy AWS
        env:
          AWS_DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          if [ "$AWS_DEPLOY_ENABLED" != 'true' ]; then
            echo "::error::AWS_DEPLOY_ENABLED deve ser 'true' no environment aws-production."
            exit 1
          fi
      - name: Diagnosticar somente sub e aud OIDC
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          try:
              url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              separator = "&" if "?" in url else "?"
              url += separator + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)["value"]
              payload = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
              print(json.dumps({"sub": claims["sub"], "aud": claims["aud"]}))
          except Exception:
              raise SystemExit(1) from None
          PY
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Conferir configuração explícita
        run: |
          for name in AWS_REGION AWS_ROLE_ARN EB_APPLICATION EB_ENVIRONMENT EB_ARTIFACT_BUCKET RDS_CA_BUNDLE_URL; do
            test -n "${!name}" || { echo "Variável ausente: $name"; exit 1; }
          done
          case "$RDS_CA_BUNDLE_URL" in
            https://truststore.pki.rds.amazonaws.com/*) ;;
            *) echo "Use o endpoint HTTPS oficial de certificados RDS."; exit 1 ;;
          esac
      - name: Incluir CA pública no pacote
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$RDS_CA_BUNDLE_URL" -o rds-ca.pem
          python scripts/build_bundle.py --rds-ca rds-ca.pem
      - name: Validar imagem do pacote final com CA
        run: |
          mkdir bundle-final
          python -m zipfile -e dist/mediatrack.zip bundle-final
          docker build -t mediatrack-release bundle-final
          docker run --rm mediatrack-release python -c "import ssl; ssl.create_default_context(cafile='/app/certs/rds-ca.pem')"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mediatrack-${{ github.run_id }}
      - name: Conferir destino existente e registrar versão anterior
        run: |
          aws elasticbeanstalk describe-environments --application-name "$EB_APPLICATION" --environment-names "$EB_ENVIRONMENT" --no-include-deleted > "$RUNNER_TEMP/eb-before.json"
          python scripts/validate_eb_environment.py "$RUNNER_TEMP/eb-before.json" --application "$EB_APPLICATION" --environment "$EB_ENVIRONMENT"
      - name: Implantar somente no ambiente existente
        run: |
          aws s3 cp dist/mediatrack.zip "s3://$EB_ARTIFACT_BUCKET/mediatrack/$VERSION.zip" --only-show-errors
          aws elasticbeanstalk create-application-version --application-name "$EB_APPLICATION" --version-label "$VERSION" --source-bundle "S3Bucket=$EB_ARTIFACT_BUCKET,S3Key=mediatrack/$VERSION.zip"
          aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENVIRONMENT"
          aws elasticbeanstalk describe-environments --application-name "$EB_APPLICATION" --environment-names "$EB_ENVIRONMENT" --no-include-deleted > "$RUNNER_TEMP/eb-after.json"
          python scripts/validate_eb_environment.py "$RUNNER_TEMP/eb-after.json" --application "$EB_APPLICATION" --environment "$EB_ENVIRONMENT" --version "$VERSION"
